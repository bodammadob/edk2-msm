name: Build UEFI Firmware

on:
  push:
    branches: [onclite]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout edk2-msm
        uses: actions/checkout@v4
        with:
          ref: onclite

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu nasm python3 make git build-essential uuid-dev device-tree-compiler

      - name: Clone submodule repos directly
        run: |
          git clone --depth 1 https://github.com/tianocore/edk2.git Common/edk2
          git clone --depth 1 https://github.com/tianocore/edk2-platforms.git Common/edk2-platforms
          git clone --depth 1 https://github.com/BigfootACA/simple-init.git GPLDrivers/Library/SimpleInit

      - name: Build UEFI for onclite
        run: |
          ./build.sh --device onclite --release RELEASE

      - name: Upload UEFI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: edk2-msm-uefi
          path: |
            Build/onclite/RELEASE_GCC5/boot.img
            Build/onclite/RELEASE_GCC5/FV/MSM8953_UEFI.fd
